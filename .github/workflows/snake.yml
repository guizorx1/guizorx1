name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#b3121b&color_dots=#ebedf0,#ffd6c2,#ff9a5c,#e2461a,#8a0f14
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5a1f&color_dots=#161b22,#4a1410,#8a1c12,#d23b14,#ffb347
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
